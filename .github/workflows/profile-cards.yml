name: Update Profile Cards

on:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/profile-cards.yml, .github/scripts/generate_profile_cards.py]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Generate cards from public repository data
        run: python .github/scripts/generate_profile_cards.py
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all cards
        shell: python
        run: |
          import pathlib
          import xml.etree.ElementTree as ET
          for name in ['stats', 'languages', 'videomae', 'planner']:
              path = pathlib.Path('dist') / f'{name}.svg'
              root = ET.parse(path).getroot()
              assert root.tag.endswith('svg'), f'Invalid SVG: {path}'
              text = ' '.join(root.itertext()).lower()
              assert 'something went wrong' not in text, f'Error card: {path}'

      - name: Publish generated cards
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5
        with:
          target_branch: profile-cards
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          jekyll: false
          commit_message: "chore: refresh profile cards"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
