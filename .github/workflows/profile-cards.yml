name: Update Profile Cards

on:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/profile-cards.yml]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Public GitHub activity
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: stats
          core_version: "2.1.3"
          fail_on_error: "true"
          options: username=CassieuiL&show_icons=true&hide_rank=true&custom_title=Public%20GitHub%20Activity&card_width=430&bg_color=0d1117&title_color=58d5e5&icon_color=7ee7bd&text_color=c9d1d9&border_color=30363d&border_radius=8&disable_animations=true
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Languages in original code repositories
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: top-langs
          core_version: "2.1.3"
          fail_on_error: "true"
          options: username=CassieuiL&layout=compact&langs_count=6&card_width=360&custom_title=Code%20Languages&exclude_repo=CassieuiL,opencv_contrib,orbbec-live-rgb-collector&bg_color=0d1117&title_color=58d5e5&text_color=c9d1d9&border_color=30363d&border_radius=8&disable_animations=true
          path: dist/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: VideoMAE repository card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: pin
          core_version: "2.1.3"
          fail_on_error: "true"
          options: username=CassieuiL&repo=cv-research-videomae&bg_color=0d1117&title_color=58d5e5&icon_color=7ee7bd&text_color=c9d1d9&border_color=30363d&border_radius=8
          path: dist/videomae.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Robot planner repository card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: pin
          core_version: "2.1.3"
          fail_on_error: "true"
          options: username=CassieuiL&repo=robocup-home-service-sim&bg_color=0d1117&title_color=58d5e5&icon_color=7ee7bd&text_color=c9d1d9&border_color=30363d&border_radius=8
          path: dist/planner.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all cards
        shell: python
        run: |
          import pathlib
          import xml.etree.ElementTree as ET
          for name in ['stats', 'languages', 'videomae', 'planner']:
              path = pathlib.Path('dist') / f'{name}.svg'
              root = ET.parse(path).getroot()
              assert root.tag.endswith('svg'), f'Invalid SVG: {path}'
              text = ' '.join(root.itertext()).lower()
              assert 'something went wrong' not in text, f'Error card: {path}'

      - name: Publish generated cards
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5
        with:
          target_branch: profile-cards
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          jekyll: false
          commit_message: "chore: refresh profile cards"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
